# reload configuratoin
unbind r 
bind r source-file ~/.config/tmux/tmux.conf

set -g mouse on

# set-option -g prefix C-a
#bind-key C-a send-prefix

set-option -sg escape-time 0
set -g set-clipboard on

BLOCK="█" #▊
BG="#222436"
# BG="#1a1b26"
FG="#c8d3f5"
DIMMED_FG="#757C96"
OLIVE="#ABC4A1"
OLIVE01="#444C51"
OLIVE02="#67746C"
OLIVE03="#899C86"
GREY="#383C5B"
GREY01="#282A3F"
GREY02="#2D3049"
GREY03="#333652"

set-option -g status-position top
set-option -g status-style bg=${BG},fg=${OLIVE}
set-option -g status-left "#S"
set-option -g status-right "#H"
set-option -g status-justify "centre"
set-option -g window-status-format "\
#[fg=${GREY01}]${BLOCK}\
#[fg=${GREY02}]${BLOCK}\
#[fg=${GREY03}]${BLOCK}\
#[fg=${GREY}]${BLOCK}\
#[fg=${DIMMED_FG},bg=${GREY}]#I #W\
#[fg=${GREY}]${BLOCK}\
#[fg=${GREY03}]${BLOCK}\
#[fg=${GREY02}]${BLOCK}\
#[fg=${GREY01}]${BLOCK}"

set-option -g window-status-current-format "\
#[fg=${OLIVE01}]${BLOCK}\
#[fg=${OLIVE02}]${BLOCK}\
#[fg=${OLIVE03}]${BLOCK}\
#[fg=${OLIVE}]${BLOCK}\
#[fg=${BG},bg=${OLIVE},italics,bold]#I #W\
#[fg=${OLIVE}]${BLOCK}\
#[fg=${OLIVE03}]${BLOCK}\
#[fg=${OLIVE02}]${BLOCK}\
#[fg=${OLIVE01}]${BLOCK}"


set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

# vim tmux navigator key mappings
set -g @vim_navigator_mapping_left "C-H"
set -g @vim_navigator_mapping_right "C-L"
set -g @vim_navigator_mapping_up "C-Left C-k"
set -g @vim_navigator_mapping_down "C-Left C-j"
set -g @vim_navigator_mapping_prev ""  # removes the C-\ binding

# Set new panes to open in current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

