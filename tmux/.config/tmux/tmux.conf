# reload configuratoin
unbind r
bind r source-file ~/.config/tmux/tmux.conf

set -g mouse on

# set-option -g prefix C-a
#bind-key C-a send-prefix

set-option -sg escape-time 0
set -g set-clipboard on

background="#191A1C"
foreground="#BCBEC4"
selection_background="#25324D"
selection_foreground="#BCBEC4"
cursor="#CED0D6"
cursor_text_color="#1E1F22"
macos_titlebar_color=system

color0="#000000"
color1="#F27481"
color2="#6BCC62"
color3="#E0CE70"
color4="#5594FA"
color5="#C092FA"
color6="#47CCBD"
color7="#CED0D6"
color8="#4E5157"
color9="#FF6B7A"
color10="#67FF59"
color11="#FFEC1A"
color12="#3399FF"
color13="#D970FF"
color14="#40FFE9"
color15="#FFFFFF"

active_tab_foreground="#BCBEC4"
active_tab_background="#191A1C"
inactive_tab_foreground="#BCBEC4"
inactive_tab_background="#1E1F22"
tab_bar_background="#1E1F22"

set-option -g status-position top
set-option -g status-style bg=${tab_bar_background},fg=${color1}
set -g status-right '#(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD)'
set-option -g status-left ""
set-option -g status-left-length 100
# set-option -g status-right "#S - @#H"
#rset-option -g status-justify "centre"
set-option -g window-status-format "\
#[fg=${inactive_tab_foreground},bg=${inactive_tab_background}]#I #W "

set-option -g window-status-current-format "\
#[fg=${active_tab_foreground},bg=${active_tab_background},bold] #I #W "

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

# vim tmux navigator key mappings
set -g @vim_navigator_mapping_left "C-H"
set -g @vim_navigator_mapping_right "C-L"
set -g @vim_navigator_mapping_up "C-Left C-k"
set -g @vim_navigator_mapping_down "C-Left C-j"
set -g @vim_navigator_mapping_prev ""  # removes the C-\ binding

# Set new panes to open in current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

